name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # 1) Instala pnpm primero (lee la versión de packageManager)
      - name: Setup pnpm (use packageManager)
        uses: pnpm/action-setup@v4
        with:
          run_install: false
          package_json_file: package.json

      # 2) Luego Node con cache de pnpm (ya existe pnpm en PATH)
      - name: Setup Node (LTS)
        uses: actions/setup-node@v4
        with:
          node-version: "lts/*"
          cache: pnpm

      - name: Show versions
        run: |
          node -v
          pnpm -v

      - name: Install deps (frozen lockfile)
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm -r --if-present lint

      - name: Typecheck
        run: pnpm -r --if-present typecheck

      - name: Run tests (web only for now)
        run: pnpm -C apps/web test

      - name: Build
        run: pnpm -r --if-present build
        env:
         NEXT_PUBLIC_API_BASE_URL: "http://localhost:3001"
         NEXT_PUBLIC_CHAIN_ID: "8453"
         NEXT_PUBLIC_ZEROEX_EXCHANGE_PROXY: "0xDef1C0ded9bEc7F1A1670819833240f027b25EfF"
         CHAIN_ID: "8453"
         ZEROEX_EXCHANGE_PROXY: "0xDef1C0ded9bEc7F1A1670819833240f027b25EfF"
