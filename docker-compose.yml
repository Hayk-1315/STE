services:
  postgres:
    image: postgres:16-alpine
    container_name: ste_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ste
      POSTGRES_PASSWORD: ste
      POSTGRES_DB: ste
    ports:
      - "5432:5432"
    volumes:
      - ste_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ste -d ste"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  ste_pg_data:
